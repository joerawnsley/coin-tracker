{% extends "base.html" %}

{% block title %}Joe's Coins - Edit Coin{% endblock %}

{% block content %}

<p>Enter your login details</p>

<form action="/login" method="POST" class="login-form">

    <div class="form-group">
        <label for="username">Username</label>
        <input 
        type="text" 
        id="username" 
        name="username" 
        required
        >
    </div>

  <div class="form-group">
        <label for="password">Password</label>
        <input 
        type="text" 
        id="password" 
        name="password" 
        required
        >
  </div>

</form>

{% endblock %}
