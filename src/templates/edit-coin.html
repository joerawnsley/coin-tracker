{% extends "base.html" %}

{% block title %}Joe's Coins - Edit Coin{% endblock %}

{% block content %}

<p>Edit details for the <b>{{ coin.coinName }}</b> coin</p>

<form action="/update-coin" method="POST" class="coin-edit-form">

  <!-- Path - Uneditable) -->
  <div class="form-group">
    <label for="coin-path">Coin Path</label>
    <input 
      type="text" 
      id="coin-path" 
      name="path" 
      value="{{coin.coinPath}}"
      disabled 
      aria-describedby="path-help"
    >
  </div>

  <!-- Name (Editable) -->
  <div class="form-group">
    <label for="coin-name">Coin Name</label>
    <input 
      type="text" 
      id="coin-name" 
      name="name" 
      value="{{coin.coinName}}" 
      required
    >
  </div>

  <!-- Duties (Selection) -->
<div class="form-group">
  <label>Duties for this coin:</label>
  
  <!-- Container with a max-height and overflow makes it a neat scrollable box -->
  <div class="checkbox-list-box" style="max-height: 200px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; border-radius: 4px;">
    {% for duty in duties %}
      <div class="checkbox-item" style="margin-bottom: 8px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input 
            type="checkbox" 
            name="duties" 
            value="{{ duty.dutyNumber }}"
            {% if duty.dutyNumber in coin.duties %}checked{% endif %}
          >
          <span><b>Duty {{ duty.dutyNumber }}:</b> {{duty.description}}</span>
        </label>
      </div>
    {% endfor %}
  </div>
</div>

  <!-- Completed Property (Radio Buttons) -->
  <div class="form-group">
    <span class="label-mock">Coin Completed?</span>
    <div class="radio-group">
      <label>
        <input type="radio" name="completed" value="true" {% if coin.isComplete %}checked{% endif %}> Yes
      </label>
      <label>
        <input type="radio" name="completed" value="false" {% if not coin.isComplete %}checked{% endif %}> No
      </label>
    </div>
  </div>

  <!-- Form Actions -->
  <div class="form-actions">
    <button type="submit" class="btn-save">Save Changes</button>
    <button type="button" class="btn-cancel" onclick="window.history.back()">Cancel</button>
    
    <!-- Delete Action (Triggers the hidden delete form below) -->
    <button 
      type="submit" 
      form="delete-coin-form" 
      class="btn-delete"
    >
      Delete Coin
    </button>
  </div>
</form>

<!-- Separate Delete Form (Best practice so it hits a DELETE or separate POST endpoint) -->
<form 
  id="delete-coin-form" 
  action="/delete-coin" 
  method="POST" 
  onsubmit="return confirm('Are you absolutely sure you want to delete this coin? This action cannot be undone.');"
>
  <!-- If your backend uses a hidden method override for DELETE requests, you can uncomment this line: -->
  <!-- <input type="hidden" name="_method" value="DELETE"> -->
</form>



{% endblock %}
