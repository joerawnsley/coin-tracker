name: build and deploy
run-name: running deployment
on:
  push:
    branches:
      - main
      - rate-limit
  workflow_dispatch:
    
permissions:
    id-token: write

env:
  DB_ENVIRONMENT: ltest
  DB_LOGGING: off
  JWT_SECRET: ${{ secrets.JWT_SECRET }}

# also dockerfile should set up virtual environment

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v5
          
          - name: Install requirements
            run: pip install -r requirements.txt

          - name: Run tests
            run:  python3 -m pytest

    deploy:
       runs-on: ubuntu-latest
       needs: test
       steps:
          - name: Checkout
            uses: actions/checkout@v5

          - name: Configure AWS credentials
            uses: aws-actions/configure-aws-credentials@v6.1.0
            with:
              role-to-assume: arn:aws:iam::261219435789:role/github-actions-jbr
              aws-region: eu-west-2

          - name: Get Caller Identity
            run: aws sts get-caller-identity
        
          - name: Login to Amazon ECR
            id: login-ecr
            uses: aws-actions/amazon-ecr-login@v2
            
          - name: Build, tag, and push docker image to Amazon ECR
            id: build-image
            run: |
               docker build -t jbr-coin-tracker .
               docker tag jbr-coin-tracker:latest 261219435789.dkr.ecr.eu-west-2.amazonaws.com/jbr-coin-tracker:latest
               docker push 261219435789.dkr.ecr.eu-west-2.amazonaws.com/jbr-coin-tracker:latest
          
          - name: Render Amazon ECS task definition
            id: task-def
            uses: aws-actions/amazon-ecs-render-task-definition@v1
            with:
              task-definition: .github/workflows/ecs_task.json
              container-name: coin-tracker-server
              image: 261219435789.dkr.ecr.eu-west-2.amazonaws.com/jbr-coin-tracker:latest
              environment-variables: |
                DB_ENVIRONMENT=prod
                DB_LOGGING=off
                DB_HOST=${{ secrets.DB_HOST }}
                DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                JWT_SECRET=${{ secrets.JWT_SECRET }}

          - name: Deploy to Amazon ECS service
            uses: aws-actions/amazon-ecs-deploy-task-definition@v2
            with:
              task-definition: ${{ steps.task-def.outputs.task-definition }}
              service: jbr-ecs-service
              cluster: jbr-cluster
              wait-for-service-stability: true
